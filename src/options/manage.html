<!doctype html>
<html lang="en">
  <head>
    <title>Settings</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Manage redirect">
    <link rel="stylesheet" href="../lib/oat/oat.min.css">
    <script src="../lib/oat/oat.min.js" defer></script>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="header hstack justify-center">
      <div id="header-tab" class="hstack">
        <div class="tab current" data-action="switchTo" data-name="manage">Manage</div>
        <div class="tab" data-action="switchTo" data-name="options">Options</div>
      </div>
    </header>
    <main class="container vstack">
      <div id="tab-contents">
        <section data-name="manage" data-display="true">
          <h2 class="page-desc">Redirects</h2>
          <button 
              id="add-redirect-btn"
              class="add-button button outline" 
              data-action="goTo" data-path="add-redirect.html">
            ＋ New
          </button>
          <div id="redirects-list" class="mt-6"></div>
        </section>
        <section data-name="options" data-display="false">
          <h2 class="page-desc">Reset extention's data</h2>
          <p>
            This will reset the data of the extension.
          </p>
          <button type="button" id="reset-data" data-variant="danger">Reset</button>
        </section>
      </div>
    </main>
    <script type="module" src="./scripts/manage.js"></script>
    <script type="module" src="./scripts/info.js"></script>
  </body>
</html>
