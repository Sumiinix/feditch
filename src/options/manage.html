<!doctype html>
<html lang="en">
  <head>
    <title>Settings</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Manage redirect">
    <link rel="stylesheet" href="../lib/oat/oat.min.css">
    <script src="../lib/oat/oat.min.js" defer></script>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="header hstack">
      <div id="header-tab">
        <div data-action="switchTo" data-name="manage">Manage</div>
        <div data-action="switchTo" data-name="options">Options
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
            <!-- Icon downloaded from https://icon-sets.iconify.design/material-symbols/info-outline-rounded/ -->
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M12.713 16.713Q13 16.425 13 16v-4q0-.425-.288-.712T12 11t-.712.288T11 12v4q0 .425.288.713T12 17t.713-.288m0-8Q13 8.425 13 8t-.288-.712T12 7t-.712.288T11 8t.288.713T12 9t.713-.288M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m0-2q3.35 0 5.675-2.325T20 12t-2.325-5.675T12 4T6.325 6.325T4 12t2.325 5.675T12 20m0-8" />
          </svg>
        </div>
      </div>
    </header>
    <main class="container vstack">
      <div id="tab-contents">
        <section data-name="manage" data-display="true">
          <h2 class="page-desc">Manage redirect</h2>
          <button class="add-button button outline" data-open-path="add-redirect.html">
            ＋ New
          </button>
          <div id="redirects-list" class="mt-6"></div>
        </section>
        <section data-name="options" data-display="false">
          <h2 class="page-desc">Reset extention's data</h2>
          <p>
            This will reset the data of the extension.
          </p>
          <button type="button" id="reset-data">Reset</button>
        </section>
      </div>
    </main>
    <script type="module" src="./scripts/manage.js"></script>
    <script type="module" src="./scripts/info.js"></script>
  </body>
</html>
